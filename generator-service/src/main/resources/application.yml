server:
  port: 8083

spring:
  application:
    name: generator-service

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    config:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true


jwt:
  secret: mysupersecretkeymysupersecretkey123456


springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html